name: Cart DEV CI

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image-tag.outputs.short_sha }}


    steps:

      # -----------------------------------
      # 1. Checkout
      # -----------------------------------
      - name: Checkout source
        uses: actions/checkout@v4


      # -----------------------------------
      # 2. Python setup
      # -----------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      # -----------------------------------
      # 3. Install dependencies
      # -----------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # -----------------------------------
      # 4. Unit tests
      # -----------------------------------
      - name: Run unit tests
        run: |
          python -m pytest -v


      # -----------------------------------
      # 5. Trivy filesystem scan
      # -----------------------------------
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Set short Git SHA
        id: image-tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      # -----------------------------------
      # 6. Build Docker image
      # -----------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ vars.ECR_REPOSITORY }}:$SHORT_SHA .


      # -----------------------------------
      # 7. Trivy Docker image scan
      # -----------------------------------
      # - name: Trivy image vulnerability scan
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: ${{ vars.ECR_REPOSITORY }}:$SHORT_SHA
      #     severity: HIGH,CRITICAL
      #     exit-code: 1
      #     ignore-unfixed: true


      # -----------------------------------
      # 8. AWS authentication using OIDC
      # -----------------------------------
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ecommerce-develop-github-actions-role
          aws-region: ${{ vars.AWS_REGION }}


      # -----------------------------------
      # 9. Login to ECR
      # -----------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # -----------------------------------
      # 10. Tag image
      # -----------------------------------
      - name: Tag Docker image
        run: |
          docker tag \
            ${{ vars.ECR_REPOSITORY }}:$SHORT_SHA \
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:$SHORT_SHA


      # -----------------------------------
      # 11. Push image
      # -----------------------------------
      - name: Push Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:$SHORT_SHA

  deploy-dev:
    name: Trigger DEV Deployment
    needs: build-scan-push
    uses: ./.github/workflows/dev-cd.yml
    with:
      image_tag: ${{ needs.build-scan-push.outputs.image_tag }}
    secrets: inherit
