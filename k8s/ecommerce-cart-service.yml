
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-cart-service
  ### Namespace containing your cart Deployment
  namespace: ecommerce-cart
  labels:
    app: ecommerce-cart

spec:
  ### Exposes cart Service internally
  type: ClusterIP

  ### Routes traffic to Pods with this label
  selector:
    app: ecommerce-cart

  ports:
    - name: http
      protocol: TCP
      ### Port exposed by the Kubernetes Service
      port: 8003
      ### FastAPI container port
      targetPort: 8003
